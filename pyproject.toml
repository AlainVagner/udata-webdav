[project]
name = "udata-webdav"
version = "0.1.0"
description = "Read-only WebDAV server exposing all files from data.public.lu"
requires-python = ">=3.9"
dependencies = [
    "wsgidav>=4.0",
    "cheroot>=8.0",
    "requests>=2.28",
]

[project.scripts]
udata-webdav = "server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "dataprovider"]
